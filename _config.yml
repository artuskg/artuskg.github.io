# Site configuration for the Chirpy theme (https://github.com/cotes2020/jekyll-theme-chirpy)

theme: jekyll-theme-chirpy

lang: en

# Empty keeps dates in UTC, as on the previous build.
timezone:

# jekyll-seo-tag settings
title: "Artus' thoughts"

tagline: On AI and whatever else comes to mind

description: >-
  ArtusKG on AI and whatever else comes to his mind

url: "https://artus.ai"

github:
  username: artuskg

social:
  name: ArtusKG
  links:
    - https://github.com/artuskg

webmaster_verifications:
  google:
  bing:

analytics:
  google:
    id:

pageviews:
  provider:

# Empty follows the reader's system setting; the sidebar has a light/dark toggle.
theme_mode:

cdn:

avatar: /assets/img/avatar.svg

social_preview_image:

toc: true

actions:
  edit_post:
    enabled: false

comments:
  provider:

assets:
  self_host:
    enabled:

# No service worker, so readers never see a stale cached copy of a post.
pwa:
  enabled: false
  cache:
    enabled: false

paginate: 10

baseurl: ""

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      # Keep the URLs of the earlier Minima site.
      permalink: /:year/:month/:day/:title:output_ext
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"
  - Gemfile
  - Gemfile.lock
  - vendor

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
